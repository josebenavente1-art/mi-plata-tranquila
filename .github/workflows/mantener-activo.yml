name: Mantener activa la base de datos

# Supabase gratis pausa el proyecto tras ~7 días sin uso.
# Esta tarea hace una consulta liviana cada 3 días para evitarlo.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "supabaseAnonKey: '[^']*'" config.js | cut -d"'" -f2)
          curl -fsS "$URL/rest/v1/app_docs?select=doc_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo "Base de datos activa"
